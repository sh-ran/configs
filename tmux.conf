# ~/.tmux.conf

# ---- Prefix -----------------------------------------------------------
# C-Space avoids collisions with vim/readline defaults
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---- General sanity ------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # true color in nvim
set -sg escape-time 0                              # no delay after prefix (vim <Esc> lag fix)
set -g history-limit 50000
set -g base-index 1                                # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on                         # renumber windows when one closes
set -g focus-events on                             # lets nvim autoread work in panes
set -g mouse on                                    # click to select pane/window, drag to resize

# ---- Reload config quickly ------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ---- Splits ----------------------------------------------------------
# Open in the current path, and use intuitive split characters
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# ---- Pane navigation (vim-style, seamless with nvim splits) -----------
# Requires the vim-tmux-navigator plugin in Neovim to move INTO nvim splits
# with the same keys; these bindings handle tmux's side of that.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Resize panes with prefix + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Window navigation --------------------------------------------------
bind -n M-h previous-window
bind -n M-l next-window

# ---- Copy mode (vi keys) -------------------------------------------------
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle

# ---- Status bar (jellybeans-style: dark bg, green/yellow accents) -------
set -g status-position bottom
set -g status-style "bg=#1c1c1c,fg=#e8e8d3"
set -g status-left-length 30
set -g status-right-length 60
set -g clock-mode-style 12

set -g status-left "#[fg=#1c1c1c,bg=#99ad6a,bold] #S #[fg=#99ad6a,bg=#1c1c1c]"
set -g status-right "#[fg=#fad07a,bg=#1c1c1c]#[fg=#1c1c1c,bg=#fad07a] %I:%M %p #[fg=#8fbfdc,bg=#fad07a]#[fg=#1c1c1c,bg=#8fbfdc,bold] #h "

setw -g window-status-current-format "#[fg=#1c1c1c,bg=#e8e8d3,bold] #I:#W #[fg=#e8e8d3,bg=#1c1c1c]"
setw -g window-status-format " #I:#W "
setw -g window-status-activity-style "fg=#cf6a4c"

set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#99ad6a"

# ---- Plugins (tpm) ---------------------------------------------------
# Bootstrap: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then press prefix + I inside tmux to install
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
